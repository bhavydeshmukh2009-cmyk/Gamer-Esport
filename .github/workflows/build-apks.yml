name: Build GAMER eSPORTS APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create Android project
        run: |

          # Create folders
          mkdir -p UserApp/app/src/main/java/com/gameresports/user
          mkdir -p UserApp/app/src/main/res/values
          mkdir -p UserApp/app/src/main/assets

          mkdir -p AdminApp/app/src/main/java/com/gameresports/admin
          mkdir -p AdminApp/app/src/main/res/values
          mkdir -p AdminApp/app/src/main/assets

          # Copy User HTML
          cp GAMER_eSPORTS_USER_PANEL_COIN_DEBIT_FIXED-1.html \
             UserApp/app/src/main/assets/index.html

          # Copy Admin HTML
          cp GAMER_eSPORTS_ADMIN_PANEL_CATEGORY_DELETE_FINAL_v2.html \
             AdminApp/app/src/main/assets/index.html


          # Root settings
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GAMER_eSPORTS"

          include(":UserApp")
          include(":AdminApp")
          EOF


          # Root Gradle
          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF


          # Gradle properties
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF


          # User App Gradle
          cat > UserApp/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.gameresports.user"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.gameresports.user"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.12.1")
          }
          EOF


          # Admin App Gradle
          cat > AdminApp/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.gameresports.admin"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.gameresports.admin"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.webkit:webkit:1.12.1")
          }
          EOF


          # USER MainActivity
          cat > UserApp/app/src/main/java/com/gameresports/user/MainActivity.java <<'EOF'
          package com.gameresports.user;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setDatabaseEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF


          # ADMIN MainActivity
          cat > AdminApp/app/src/main/java/com/gameresports/admin/MainActivity.java <<'EOF'
          package com.gameresports.admin;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setDatabaseEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setAllowContentAccess(true);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());

                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF


          # Theme
          cat > UserApp/app/src/main/res/values/styles.xml <<'EOF'
          <resources>

              <style name="AppTheme"
                  parent="Theme.AppCompat.Light.NoActionBar">

                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>

              </style>

          </resources>
          EOF


          cp UserApp/app/src/main/res/values/styles.xml \
             AdminApp/app/src/main/res/values/styles.xml


          # USER Manifest
          cat > UserApp/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  android:label="GAMER eSPORTS">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


          # ADMIN Manifest
          cat > AdminApp/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET"/>

              <application
                  android:allowBackup="false"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/AppTheme"
                  android:label="GAMER eSPORTS Admin">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'


      - name: Build User APK
        run: |
          gradle :UserApp:assembleDebug --no-daemon


      - name: Build Admin APK
        run: |
          gradle :AdminApp:assembleDebug --no-daemon


      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: GAMER-eSPORTS-USER-APK
          path: UserApp/build/outputs/apk/debug/*.apk


      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: GAMER-eSPORTS-ADMIN-APK
          path: AdminApp/build/outputs/apk/debug/*.apk
